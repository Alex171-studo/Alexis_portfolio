<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Hacker IDE — VSCode Autocomplete</title>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
            font-family: Consolas, monospace;
        }

        #topbar {
            background: #020;
            color: #0f0;
            padding: 10px 20px;
            font-size: 18px;
            border-bottom: 2px solid #0a0;
            text-shadow: 0 0 6px #0f0;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            height: 100%;
            border-right: 2px solid #030;
        }

        #console {
            width: 40%;
            background: #000;
            padding: 15px;
            overflow-y: auto;
            color: #0f0;
            font-size: 15px;
        }

        .console-line {
            color: #0f0;
            margin-bottom: 8px;
            text-shadow: 0 0 6px #0f0;
        }

        .console-error {
            color: #f00;
            margin-bottom: 8px;
            text-shadow: 0 0 6px #f00;
        }
    </style>
</head>

<body>

    <div id="topbar">💀 HACKER IDE — VSCode Autocomplete + Auto-Run</div>

    <div id="main">
        <div id="editor"></div>
        <div id="console"></div>
    </div>

    <script>
        /* --------------------------------------------------------------------
           Chargement de Monaco (le moteur de VS Code)
        --------------------------------------------------------------------- */
        require.config({
            paths: {
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {

            /* -----------------------------------------------------------
               Activation COMPLETE des libs JavaScript → Fix AUTOCOMPLETE
               ----------------------------------------------------------- */
            monaco.languages.typescript.javascriptDefaults.setCompilerOptions({
                allowNonTsExtensions: true,
                allowJs: true,
                checkJs: false,
                target: monaco.languages.typescript.ScriptTarget.ESNext,
                lib: [
                    "es5",
                    "es6",
                    "es7",
                    "es2015",
                    "es2016",
                    "es2017",
                    "es2018",
                    "es2019",
                    "es2020",
                    "dom"
                ]
            });

            monaco.languages.typescript.javascriptDefaults.setDiagnosticsOptions({
                noSemanticValidation: false,
                noSyntaxValidation: false
            });

            monaco.languages.typescript.javascriptDefaults.setEagerModelSync(true);

            /* -----------------------------------------------------------
               Création de l’éditeur façon VS Code
               ----------------------------------------------------------- */
            const editor = monaco.editor.create(document.getElementById('editor'), {
                value: `// ✨ Autocomplétion OK pour :
// length, includes, map, filter, push, sort, etc.

const fruits = ["pomme", "banane", "mangue"];

console.log(fruits.includes("banane"));
console.log(fruits.map(f => f.toUpperCase()));`,
                language: 'javascript',
                theme: 'vs-dark',
                fontSize: 16,
                automaticLayout: true,
                minimap: { enabled: false }
            });

            const consoleDiv = document.getElementById("console");

            function logToConsole(type, msg) {
                const line = document.createElement("div");
                line.className = (type === "error" ? "console-error" : "console-line");
                line.textContent = msg;
                consoleDiv.appendChild(line);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // Hijack console.log pour afficher dans la console hacker
            const oldLog = console.log;
            console.log = (...args) => {
                args.forEach(a => logToConsole("log", a));
                oldLog(...args);
            };

            let timer;

            function autoRun() {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    consoleDiv.innerHTML = "";
                    executeCode();
                }, 400);
            }

            function executeCode() {
                const code = editor.getValue();
                try {
                    const result = eval(code);
                    if (result !== undefined) logToConsole("log", result);
                } catch (err) {
                    logToConsole("error", err);
                }
            }

            // Exécution automatique dès qu’on tape
            editor.onDidChangeModelContent(autoRun);
        });
    </script>

</body>

</html>
